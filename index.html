<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time To Show</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, rgba(160,0,0,0.35) 0%, #000 65%),
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.02),
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
  color: #fff;
  font-family: 'Cinzel', serif;
  text-align: center;
  animation: breath 6s infinite alternate;
}

@keyframes breath {
  from { filter: brightness(0.9); }
  to { filter: brightness(1.05); }
}

h1 {
  padding-top: 40px;
  font-size: 1.8rem;
  letter-spacing: 6px;
  color: #c00000;
  text-transform: uppercase;
}

/* ===== Rows ===== */
.container {
  max-width: 1200px;
  margin: 80px auto;
  display: flex;
  flex-direction: column;
  gap: 120px;
  padding: 0 30px;
}

.row {
  display: flex;
  align-items: center;
  gap: 80px;
}

/* ===== Preview Box ===== */
.preview {
  width: 260px;
  height: 360px;
  border: 2px solid rgba(200,0,0,0.6);
  background:
    linear-gradient(135deg, #000 40%, #1a0000 100%);
  box-shadow:
    0 0 40px rgba(200,0,0,0.4),
    inset 0 0 30px rgba(0,0,0,0.9);
  position: relative;
}

.preview::after {
  content: "PREVIEW";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 6px;
  font-size: 0.9rem;
  color: rgba(255,255,255,0.15);
}

/* ===== Timer ===== */
.timer {
  display: flex;
  gap: 60px;
  animation: heartbeat 2.2s infinite;
}

@keyframes heartbeat {
  0% { transform: scale(1); }
  10% { transform: scale(1.04); }
  20% { transform: scale(1); }
  100% { transform: scale(1); }
}

.unit {
  min-width: 120px;
}

.number {
  font-size: 6rem;
  font-weight: 900;
  line-height: 1;
  text-shadow:
    2px 0 red,
    -2px 0 cyan,
    0 0 30px rgba(200,0,0,0.9);
}

.seconds {
  animation: glitch 0.15s infinite;
}

@keyframes glitch {
  0% { transform: translate(0,0); }
  25% { transform: translate(-2px,1px); }
  50% { transform: translate(2px,-1px); }
  75% { transform: translate(-1px,2px); }
  100% { transform: translate(0,0); }
}

.label {
  margin-top: 14px;
  font-size: 1rem;
  letter-spacing: 4px;
  font-weight: 700;
  color: #ddd;
}

/* ===== Date line ===== */
.date {
  margin-bottom: 30px;
  letter-spacing: 5px;
  font-size: 1rem;
}

.blink {
  color: #ff2a2a;
  animation: blinkText 3.5s infinite;
}

@keyframes blinkText {
  0%,40%,70%,100% { opacity: 1; }
  45%,72% { opacity: 0; }
}

/* ===== Mobile ===== */
@media (max-width: 900px) {
  .row {
    flex-direction: column;
  }
  .container {
    gap: 100px;
  }
}
</style>
</head>

<body>

<h1>Time remaining until the first photo reveal</h1>

<div class="container">

  <!-- ===== ROW 1 ===== -->
  <div>
    <div class="date">JANUARY 25, 2026 — <span class="blink">IT BEGINS</span></div>
    <div class="row">
      <div class="preview"></div>
      <div class="timer" data-date="2026-01-25T00:00:00">
        <div class="unit">
          <div class="number days">00</div>
          <div class="label">DAYS</div>
        </div>
        <div class="unit">
          <div class="number hours">00</div>
          <div class="label">HOURS</div>
        </div>
        <div class="unit">
          <div class="number minutes">00</div>
          <div class="label">MINUTES</div>
        </div>
        <div class="unit">
          <div class="number seconds">00</div>
          <div class="label">SECONDS</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== ROW 2 ===== -->
  <div>
    <div class="date">FEBRUARY 25, 2026 — <span class="blink">IT CONTINUES</span></div>
    <div class="row">
      <div class="preview"></div>
      <div class="timer" data-date="2026-02-25T00:00:00">
        <div class="unit">
          <div class="number days">00</div>
          <div class="label">DAYS</div>
        </div>
        <div class="unit">
          <div class="number hours">00</div>
          <div class="label">HOURS</div>
        </div>
        <div class="unit">
          <div class="number minutes">00</div>
          <div class="label">MINUTES</div>
        </div>
        <div class="unit">
          <div class="number seconds">00</div>
          <div class="label">SECONDS</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
/* ===== Multiple Countdown ===== */
function updateTimers() {
  document.querySelectorAll('.timer').forEach(timer => {
    const endDate = new Date(timer.dataset.date);
    const diff = endDate - new Date();

    const days = timer.querySelector('.days');
    const hours = timer.querySelector('.hours');
    const minutes = timer.querySelector('.minutes');
    const seconds = timer.querySelector('.seconds');

    if (diff <= 0) {
      days.innerText = hours.innerText = minutes.innerText = seconds.innerText = "00";
      return;
    }

    days.innerText = Math.floor(diff / (1000*60*60*24));
    hours.innerText = String(Math.floor(diff / (1000*60*60) % 24)).padStart(2,'0');
    minutes.innerText = String(Math.floor(diff / (1000*60) % 60)).padStart(2,'0');
    seconds.innerText = String(Math.floor(diff / 1000 % 60)).padStart(2,'0');
  });
}

updateTimers();
setInterval(updateTimers, 1000);

/* ===== Heartbeat Sound ===== */
let audioStarted = false;
function startHeartbeat() {
  if (audioStarted) return;
  audioStarted = true;

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "sine";
  osc.frequency.value = 58;
  gain.gain.value = 0;

  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();

  setInterval(() => {
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.05);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
  }, 1100);
}

window.addEventListener("load", startHeartbeat);
["click","touchstart","scroll","keydown"].forEach(e =>
  document.addEventListener(e, startHeartbeat, { once: true })
);
</script>

</body>
</html>
