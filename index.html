<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time To Show</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, rgba(100,0,0,0.35) 0%, #000 65%),
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.02),
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
  color: #fff;
  font-family: 'Cinzel', serif;
  text-align: center;
  animation: breath 6s infinite alternate;
}

@keyframes breath {
  from { filter: brightness(0.9); }
  to { filter: brightness(1.05); }
}

h1 {
  padding-top: 40px;
  font-size: 1.8rem;
  letter-spacing: 6px;
  color: #e0e0e0;
  text-transform: uppercase;
}

/* ===== Layout ===== */
.container {
  max-width: 1200px;
  margin: 90px auto;
  display: flex;
  flex-direction: column;
  gap: 140px;
  padding: 0 30px;
}

.row {
  display: flex;
  align-items: center;
  gap: 90px;
}

/* ===== Preview Box ===== */
.preview {
  width: 260px;
  height: 360px;
  position: relative;
  background: #000;
  overflow: hidden;
  animation: flicker 4s infinite;
}

.preview::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(120deg,
      transparent 40%,
      rgba(255,255,255,0.15),
      transparent 60%);
  opacity: 0;
  animation: flash 5s infinite;
}

.preview::after {
  content: "LOCKED";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 6px;
  font-size: 1rem;
  opacity: 0.25;
}

@keyframes flicker {
  0%,100% { opacity: 1; }
  92% { opacity: 0.85; }
  94% { opacity: 0.4; }
  96% { opacity: 1; }
}

@keyframes flash {
  0%,90% { opacity: 0; }
  92% { opacity: 0.4; }
  100% { opacity: 0; }
}

/* ===== Timers ===== */
.timer {
  display: flex;
  gap: 60px;
  animation: heartbeat 2.2s infinite;
}

@keyframes heartbeat {
  0% { transform: scale(1); }
  10% { transform: scale(1.04); }
  20% { transform: scale(1); }
  100% { transform: scale(1); }
}

.unit { min-width: 120px; }

.number {
  font-size: 6rem;
  font-weight: 900;
  line-height: 1;
}

.seconds {
  animation: glitch 0.15s infinite;
}

@keyframes glitch {
  0% { transform: translate(0,0); }
  25% { transform: translate(-2px,1px); }
  50% { transform: translate(2px,-1px); }
  75% { transform: translate(-1px,2px); }
  100% { transform: translate(0,0); }
}

.label {
  margin-top: 14px;
  font-size: 1rem;
  letter-spacing: 4px;
  font-weight: 700;
}

/* ===== THEMES ===== */
.red .number {
  text-shadow: 2px 0 red, -2px 0 crimson, 0 0 30px rgba(200,0,0,0.9);
}
.red .preview {
  border: 2px solid rgba(200,0,0,0.6);
  box-shadow: 0 0 40px rgba(200,0,0,0.5);
}

.blue .number {
  text-shadow: 2px 0 #00b7ff, -2px 0 #0033ff, 0 0 30px rgba(0,120,255,0.9);
}
.blue .preview {
  border: 2px solid rgba(0,120,255,0.6);
  box-shadow: 0 0 40px rgba(0,120,255,0.5);
}

/* ===== Dates ===== */
.date {
  margin-bottom: 30px;
  letter-spacing: 5px;
  font-size: 1rem;
}

.blink {
  animation: blinkText 3.5s infinite;
}

@keyframes blinkText {
  0%,40%,70%,100% { opacity: 1; }
  45%,72% { opacity: 0; }
}

/* ===== Mobile ===== */
@media (max-width: 900px) {
  .row { flex-direction: column; }
}
</style>
</head>

<body>

<h1>Time remaining until photos...</h1>

<div class="container">

  <!-- ROW 1 -->
  <div class="red">
    <div class="date">JANUARY 25, 2026 — <span class="blink">IT BEGINS</span></div>
    <div class="row">
      <div class="preview"></div>
      <div class="timer" data-date="2026-01-25T00:00:00">
        <div class="unit"><div class="number days">00</div><div class="label">DAYS</div></div>
        <div class="unit"><div class="number hours">00</div><div class="label">HOURS</div></div>
        <div class="unit"><div class="number minutes">00</div><div class="label">MINUTES</div></div>
        <div class="unit"><div class="number seconds">00</div><div class="label">SECONDS</div></div>
      </div>
    </div>
  </div>

  <!-- ROW 2 -->
  <div class="blue">
    <div class="date">FEBRUARY 25, 2026 — <span class="blink">IT CONTINUES</span></div>
    <div class="row">
      <div class="preview"></div>
      <div class="timer" data-date="2026-02-25T00:00:00">
        <div class="unit"><div class="number days">00</div><div class="label">DAYS</div></div>
        <div class="unit"><div class="number hours">00</div><div class="label">HOURS</div></div>
        <div class="unit"><div class="number minutes">00</div><div class="label">MINUTES</div></div>
        <div class="unit"><div class="number seconds">00</div><div class="label">SECONDS</div></div>
      </div>
    </div>
  </div>

</div>

<script>
function updateTimers() {
  document.querySelectorAll('.timer').forEach(timer => {
    const end = new Date(timer.dataset.date) - new Date();
    const d = timer.querySelector('.days');
    const h = timer.querySelector('.hours');
    const m = timer.querySelector('.minutes');
    const s = timer.querySelector('.seconds');

    if (end <= 0) {
      d.innerText = h.innerText = m.innerText = s.innerText = "00";
      return;
    }

    d.innerText = Math.floor(end / (1000*60*60*24));
    h.innerText = String(Math.floor(end / (1000*60*60) % 24)).padStart(2,'0');
    m.innerText = String(Math.floor(end / (1000*60) % 60)).padStart(2,'0');
    s.innerText = String(Math.floor(end / 1000 % 60)).padStart(2,'0');
  });
}

updateTimers();
setInterval(updateTimers, 1000);
</script>

</body>
</html>
